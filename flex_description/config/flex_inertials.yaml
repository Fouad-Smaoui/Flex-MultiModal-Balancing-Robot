# PLACEHOLDER inertial data for FLEX's URDF/Xacro model.
#
# These are NOT measured from the real robot. They are analytically computed from primitive
# box/cylinder geometry (see docs/architecture/hardware_architecture.md, "CAD-to-Sim Pipeline")
# using an estimated total mass and the only verified physical dimensions in the repo
# (wheel radius 0.072 m, wheelbase 0.280 m, from firmware/src/main.cpp and matlab_archive/LQR.m).
#
# This file is the human-readable source of truth for those numbers; the values are duplicated
# as xacro properties in urdf/flex_*.xacro (xacro has no native YAML-loading without an extra
# dependency, so this file documents/justifies the numbers rather than being parsed directly).
#
# Replace with real SolidWorks Mass Properties output once CAD access is available.

base_link:
  mass_kg: 2.3            # matches mp (pendulum/body mass) in matlab_archive/LQR.m
  dimensions_m: {x: 0.18, y: 0.12, z: 0.30}
  inertia_kgm2: {ixx: 0.02001, iyy: 0.02346, izz: 0.00897}

wheel_link:               # per wheel (left and right identical)
  mass_kg: 0.2             # half of mr=0.4 kg (combined wheel+motor mass in the lumped model)
  radius_m: 0.072
  thickness_m: 0.03
  inertia_kgm2: {ixx: 0.0002742, iyy: 0.0005184, izz: 0.0002742}   # iyy = spin axis

leg_link:                 # per leg (left and right identical)
  mass_kg: 0.1
  dimensions_m: {x: 0.03, y: 0.03, z: 0.12}
  inertia_kgm2: {ixx: 0.0001275, iyy: 0.0001275, izz: 0.000015}

imu_link:
  mass_kg: 0.01
  dimensions_m: {x: 0.02, y: 0.02, z: 0.01}
  inertia_kgm2: {ixx: 0.000000417, iyy: 0.000000417, izz: 0.000000667}
